<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORD-CINE - Detalhes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #141414; color: #fff; font-family: Arial, sans-serif; }
        .hero { position: relative; min-height: 70vh; background-color: #000; background-size: cover; background-position: center center; display: flex; align-items: flex-end; }
        .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.92) 25%, rgba(0,0,0,0.3) 70%, rgba(0,0,0,0.05) 100%); }
        .hero-conteudo { position: relative; z-index: 2; padding: 40px; max-width: 650px; }
        .badge-original { display: inline-flex; align-items: center; gap: 8px; background: #E50914; color: #fff; font-weight: bold; font-size: 12px; padding: 6px 12px; border-radius: 4px; margin-bottom: 16px; letter-spacing: 0.5px; }
        .hero-titulo { font-size: 38px; font-weight: bold; margin-bottom: 16px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .hero-meta { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; font-size: 14px; color: #ddd; flex-wrap: wrap; }
        .meta-tag { border: 1px solid #666; padding: 3px 10px; border-radius: 4px; font-size: 12px; }
        .hero-rating { color: #f5c518; font-weight: bold; }
        .hero-sinopse { font-size: 14px; line-height: 1.6; color: #ddd; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-sinopse.expandido { -webkit-line-clamp: unset; }
        .btn-ler-mais { background: none; border: none; color: #E50914; font-weight: bold; font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 24px; display: block; }
        .hero-botoes { display: flex; gap: 14px; flex-wrap: wrap; }
        .btn-assistir-hero { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #000; font-weight: bold; padding: 12px 28px; border-radius: 6px; font-size: 15px; border: none; cursor: pointer; }
        .btn-assistir-hero:hover { background: #ddd; }
        .btn-trailer-hero { display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.15); color: #fff; font-weight: bold; padding: 12px 24px; border-radius: 6px; font-size: 15px; border: none; cursor: pointer; }
        .btn-trailer-hero:hover { background: rgba(255,255,255,0.3); }
        .btn-voltar-hero { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); color: #fff; font-weight: bold; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-size: 15px; }
        .btn-voltar-hero:hover { background: rgba(255,255,255,0.3); }
        .video-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
        .video-modal.mostrar { display: flex; }
        .video-modal-fechar { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; z-index: 301; }
        .video-modal-conteudo { width: 100%; max-width: 900px; }
        .video-modal-conteudo video, .video-modal-conteudo iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 8px; background: #000; }
        .video-modal-conteudo p { color: #fff; text-align: center; font-size: 15px; }
    </style>
</head>
<body>
    <div class="hero" id="hero">
        <div class="hero-conteudo">
            <span class="badge-original">🎬 LORD-CINE ORIGINAL</span>
            <h1 class="hero-titulo" id="filme-titulo">Carregando...</h1>
            <div class="hero-meta">
                <span id="filme-ano"></span>
                <span id="filme-duracao"></span>
                <span class="meta-tag" id="filme-genero"></span>
                <span class="hero-rating" id="filme-rating"></span>
            </div>
            <p class="hero-sinopse" id="filme-sinopse"></p>
            <button class="btn-ler-mais" id="btn-ler-mais">LER MAIS</button>
            <div class="hero-botoes">
                <button class="btn-assistir-hero" id="btn-assistir">▶ Assistir</button>
                <button class="btn-trailer-hero" id="btn-trailer">🎥 Trailer</button>
                <a href="index.html" class="btn-voltar-hero">← Voltar</a>
            </div>
        </div>
    </div>

    <div class="video-modal" id="video-modal">
        <button class="video-modal-fechar" id="btn-fechar-video">✕</button>
        <div class="video-modal-conteudo" id="video-modal-conteudo"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCxkJCD8HENp0jk2ZwU0mLDhTi9zWd5WeM",
            authDomain: "netdev-9a4e6.firebaseapp.com",
            databaseURL: "https://netdev-9a4e6-default-rtdb.firebaseio.com",
            projectId: "netdev-9a4e6",
            storageBucket: "netdev-9a4e6.firebasestorage.app",
            messagingSenderId: "612992618514",
            appId: "1:612992618514:web:36011d43647ea6d42fc8cb",
            measurementId: "G-M9H44B2LV1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function getYoutubeId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=)([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }
        function gerarEstrelas(nota) {
            const cheias = Math.round(nota / 2);
            const vazias = 5 - cheias;
            return "★".repeat(cheias) + "☆".repeat(vazias);
        }
        function abrirVideo(url) {
            const modal = document.getElementById("video-modal");
            const conteudo = document.getElementById("video-modal-conteudo");
            const youtubeId = getYoutubeId(url || "");
            if (youtubeId) {
                conteudo.innerHTML = `<iframe src="https://www.youtube.com/embed/${youtubeId}?autoplay=1" allowfullscreen allow="autoplay"></iframe>`;
            } else if (url) {
                conteudo.innerHTML = `<video controls autoplay><source src="${url}" type="video/mp4">Seu celular não suporta este vídeo.</video>`;
            } else {
                conteudo.innerHTML = `<p>Vídeo não disponível.</p>`;
            }
            modal.classList.add("mostrar");
        }
        function fecharVideo() {
            document.getElementById("video-modal").classList.remove("mostrar");
            document.getElementById("video-modal-conteudo").innerHTML = "";
        }
        document.getElementById("btn-fechar-video").addEventListener("click", fecharVideo);
        document.getElementById("video-modal").addEventListener("click", (e) => { if (e.target.id === "video-modal") fecharVideo(); });

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        if (!id) {
            document.getElementById("filme-titulo").innerText = "Filme não encontrado.";
        } else {
            db.ref("Filmes/" + id).once("value")
                .then((snapshot) => {
                    const filme = snapshot.val();
                    if (!filme) { document.getElementById("filme-titulo").innerText = "Filme não encontrado."; return; }
                    let historico = JSON.parse(localStorage.getItem("continuarAssistindo") || "[]");
                    historico = historico.filter((itemId) => itemId !== id);
                    historico.unshift(id);
                    historico = historico.slice(0, 10);
                    localStorage.setItem("continuarAssistindo", JSON.stringify(historico));
                    document.getElementById("filme-titulo").innerText = filme.Titulo;
                    document.getElementById("filme-ano").innerText = filme.Ano || "";
                    document.getElementById("filme-genero").innerText = filme.Genero || "";
                    document.getElementById("filme-duracao").innerText = filme["Duração"] ? filme["Duração"] + " min" : "";
                    document.getElementById("filme-rating").innerText = filme.Notas ? `${gerarEstrelas(filme.Notas)} ${filme.Notas}` : "";
                    document.getElementById("filme-sinopse").innerText = filme.Sinopse || "";
                    document.getElementById("hero").style.backgroundImage = `url('${filme.Fundo || filme.Capa}')`;
                    document.getElementById("btn-assistir").addEventListener("click", () => abrirVideo(filme.Link));
                    document.getElementById("btn-trailer").addEventListener("click", () => abrirVideo(filme.Trailer));
                })
                .catch((error) => { document.getElementById("filme-titulo").innerText = "Erro ao carregar filme."; console.error(error); });
        }
        document.getElementById("btn-ler-mais").addEventListener("click", () => {
            const p = document.getElementById("filme-sinopse");
            p.classList.toggle("expandido");
            document.getElementById("btn-ler-mais").innerText = p.classList.contains("expandido") ? "LER MENOS" : "LER MAIS";
        });
    </script>
</body>
</html>
