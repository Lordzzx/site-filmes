<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETDEV - Netflix Clone</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000000;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: #E50914;
            font-size: 24px;
            font-weight: bold;
        }
        .banner {
            background: linear-gradient(rgba(0,0,0,0.2), #141414), url('https://picsum.photos') no-repeat center center/cover;
            height: 250px;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }
        .banner h1 {
            margin: 0;
            font-size: 28px;
            text-shadow: 2px 2px 4px #000;
        }
        .secao {
            padding: 20px;
        }
        .secao h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .carrossel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .card {
            min-width: 140px;
            background-color: #2f2f2f;
            border-radius: 6px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 10px;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .btn-assistir {
            display: inline-block;
            background-color: #E50914;
            color: #fff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NETDEV</div>
    </header>

    <div class="banner">
        <h1>A Origem do Código</h1>
    </div>

    <div class="secao">
        <h2>Populares na Netflix</h2>
        <div class="carrossel" id="filmes-container">

        </div>
    </div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
