<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORD-CINE</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000000;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .logo {
            color: #E50914;
            font-size: 24px;
            font-weight: bold;
        }
        .nav-principal {
            display: flex;
            gap: 25px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .nav-item:hover { color: #fff; }
        .nav-icone { font-size: 16px; }
        .busca input {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            width: 220px;
        }
        .busca input::placeholder { color: #999; }
        .user-info {
            display: none;
            position: relative;
            align-items: center;
            gap: 10px;
        }
        .user-info > img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
        }
        .user-dropdown {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            background: #2f2f2f;
            border-radius: 6px;
            padding: 14px;
            min-width: 220px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
            text-align: left;
        }
        .user-dropdown.mostrar { display: block; }
        .dropdown-perfil {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
            margin-bottom: 10px;
        }
        .dropdown-perfil img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .dropdown-perfil p {
            margin: 0;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }
        .dropdown-secao {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }
        .dropdown-titulo {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 0 8px 0;
        }
        .dropdown-link {
            display: block;
            color: #ccc;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 0;
        }
        .dropdown-link:hover { color: #E50914; }
        .user-dropdown button {
            width: 100%;
            background: transparent;
            border: 1px solid #555;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .user-dropdown button:hover { background: #444; }
        .categorias {
            display: flex;
            gap: 10px;
            padding: 15px 20px 0 20px;
            overflow-x: auto;
        }
        .cat-btn {
            background: #2f2f2f;
            color: #ccc;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .cat-btn:hover { background: #444; color: #fff; }
        .cat-btn.ativo { background: #E50914; color: #fff; }
        .banner {
            background: linear-gradient(rgba(0,0,0,0.2), #141414), url('https://picsum.photos') no-repeat center center/cover;
            height: 250px;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }
        .banner h1 {
            margin: 0;
            font-size: 28px;
            text-shadow: 2px 2px 4px #000;
        }
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            background: #000;
            padding: 15px 0;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }
        .marquee-track {
            display: inline-flex;
            gap: 60px;
            animation: marquee 15s linear infinite;
        }
        .marquee-item {
            font-size: 18px;
            font-weight: bold;
            color: #777;
            letter-spacing: 1px;
        }
        @keyframes marquee {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .secao {
            padding: 20px;
        }
        .secao h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .carrossel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .card {
            min-width: 140px;
            background-color: #2f2f2f;
            border-radius: 6px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 10px;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .btn-assistir {
            display: inline-block;
            background-color: #E50914;
            color: #fff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">LORD-CINE</div>
        <nav class="nav-principal">
            <a href="index.html" class="nav-item"><span class="nav-icone">🏠</span> Início</a>
            <a href="#categorias-nav" class="nav-item"><span class="nav-icone">🎬</span> Catálogo</a>
            <a href="agenda.html" class="nav-item"><span class="nav-icone">📅</span> Agenda</a>
        </nav>
        <div class="busca">
            <input type="text" id="busca-input" placeholder="Pesquisar filmes...">
        </div>
        <div class="user-info" id="user-info">
            <img id="user-foto" src="" alt="Perfil">
            <div class="user-dropdown" id="user-dropdown">
                <div class="dropdown-perfil">
                    <img id="user-foto-dropdown" src="" alt="Perfil">
                    <p id="user-nome"></p>
                </div>
                <div class="dropdown-secao">
                    <p class="dropdown-titulo">Suporte e Comunidade</p>
                    <a href="https://chat.whatsapp.com/Ilj8Aq7M2443DPlSLWlmmF?s=cl&p=a&mlu=4&ilr=4" target="_blank" class="dropdown-link">💬 Grupo de Bate-papo</a>
                    <a href="https://chat.whatsapp.com/BbLCtumfzqTIF2lf3twymy?s=cl&p=a&mlu=4&ilr=4" target="_blank" class="dropdown-link">📝 Alternativos para Pedidos</a>
                </div>
                <button id="btn-logout">Sair</button>
            </div>
        </div>
    </header>

    <nav class="categorias" id="categorias-nav"></nav>

    <div class="banner">
        <h1>A Origem do Código</h1>
    </div>

    <div class="marquee-container">
        <div class="marquee-track">
            <span class="marquee-item">NETFLIX</span>
            <span class="marquee-item">PRIME VIDEO</span>
            <span class="marquee-item">HBO MAX</span>
            <span class="marquee-item">DISNEY+</span>
            <span class="marquee-item">NETFLIX</span>
            <span class="marquee-item">PRIME VIDEO</span>
            <span class="marquee-item">HBO MAX</span>
            <span class="marquee-item">DISNEY+</span>
        </div>
    </div>

    <div class="secao">
        <h2>Filmes</h2>
        <div class="carrossel" id="filmes-container"></div>
    </div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
