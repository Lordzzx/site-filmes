    <style>
        :root {
            --cor-vermelho: #E50914 !important;
            --cor-vermelho-hover: #b80710 !important;
            --fundo-principal: #0a0a0a !important;
            --fundo-card: #161616 !important;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--fundo-principal) !important;
            color: #ffffff !important;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .sidebar-logo .badge, .badge {
            background: var(--cor-vermelho) !important;
            color: #fff !important;
        }

        a[href*="vip"], .vip-btn {
            background-color: var(--cor-vermelho) !important;
            border-color: var(--cor-vermelho) !important;
            color: #fff !important;
        }

        .btn-assistir-grande, .btn-assistir, a.btn-assistir, button.btn-assistir, .hero-botoes a:first-child {
            background-color: var(--cor-vermelho) !important;
            color: #ffffff !important;
            border: none !important;
            font-weight: bold !important;
            border-radius: 6px;
        }
        .btn-assistir-grande:hover, .btn-assistir:hover, .hero-botoes a:first-child:hover {
            background-color: var(--cor-vermelho-hover) !important;
        }

        .card, .poster-item {
            background-color: var(--fundo-card) !important;
        }
        .card.selecionado, .card:hover, .poster-item:hover, .card:focus {
            outline: 2px solid var(--cor-vermelho) !important;
            border: 2px solid var(--cor-vermelho) !important;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.7) !important;
        }
        .card .rank {
            background: var(--cor-vermelho) !important;
            color: #fff !important;
        }

        .fa-star, .rating-star, .banner-rating, span[style*="color"] {
            color: var(--cor-vermelho) !important;
        }

        .sidebar, nav.sidebar, div[style*="position: fixed"] {
            background-color: #000000 !important;
        }
        
        .sidebar-item:hover, .sidebar-item.ativo, nav a.ativo, nav button.ativo {
            color: var(--cor-vermelho) !important;
        }

        .conteudo {
            background-color: var(--fundo-principal) !important;
            margin-left: 80px;
            width: calc(100% - 80px);
        }

        @media (max-width: 768px) {
            .sidebar {
                top: auto !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                width: 100% !important;
                height: 64px !important;
                flex-direction: row !important;
                align-items: center !important;
                justify-content: space-around !important;
                background-color: #121212 !important;
                border-top: 1px solid #222 !important;
                z-index: 999 !important;
            }
            .conteudo {
                margin-left: 0 !important;
                width: 100% !important;
                padding-bottom: 70px !important;
            }
        }
    </style>
